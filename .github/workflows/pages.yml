name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # サーバー部分（音声・OCRの中継）は公開リポジトリに入れていないので、何もしない代わりを置く
      - run: test -f voicevox-proxy.ts || echo "export const voicevoxProxy = () => ({ name: 'no-server' });" > voicevox-proxy.ts
      - run: npm run build
        env:
          YOMIAGE_BASE: /yomiage/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
